# yazi theme.toml - generated by matugen

[mgr]
cwd = { fg = "#99ccfa" }
hovered = { fg = "#003351", bg = "#99ccfa" }

marker_selected = { fg = "#b8c8da", bg = "#b8c8da" }
marker_copied   = { fg = "#d1bfe7", bg = "#d1bfe7" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }

tab_active   = { fg = "#003351", bg = "#99ccfa" }
tab_inactive = { fg = "#e0e2e8", bg = "#1c2024" }

border_style = { fg = "#8c9198" }

[mode]
normal_main = { fg = "#003351", bg = "#99ccfa", bold = true }
select_main = { fg = "#23323f", bg = "#b8c8da", bold = true }
unset_main  = { fg = "#690005", bg = "#ffb4ab", bold = true }

[status]
progress_normal = { fg = "#99ccfa", bg = "#272a2e" }

[input]
border = { fg = "#99ccfa" }

[select]
border = { fg = "#99ccfa" }
active = { fg = "#d1bfe7" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d1bfe7" },
	{ mime = "video/*", fg = "#b8c8da" },
	{ url = "*/",       fg = "#99ccfa" },
	{ url = "*",        fg = "#e0e2e8" },
]
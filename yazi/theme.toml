# yazi theme.toml - generated by matugen

[mgr]
cwd = { fg = "#ffb4a9" }
hovered = { fg = "#561e17", bg = "#ffb4a9" }

marker_selected = { fg = "#e7bdb7", bg = "#e7bdb7" }
marker_copied   = { fg = "#dec38c", bg = "#dec38c" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }

tab_active   = { fg = "#561e17", bg = "#ffb4a9" }
tab_inactive = { fg = "#f1dedc", bg = "#271d1c" }

border_style = { fg = "#a08c89" }

[mode]
normal_main = { fg = "#561e17", bg = "#ffb4a9", bold = true }
select_main = { fg = "#442926", bg = "#e7bdb7", bold = true }
unset_main  = { fg = "#690005", bg = "#ffb4ab", bold = true }

[status]
progress_normal = { fg = "#ffb4a9", bg = "#322826" }

[input]
border = { fg = "#ffb4a9" }

[select]
border = { fg = "#ffb4a9" }
active = { fg = "#dec38c" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#dec38c" },
	{ mime = "video/*", fg = "#e7bdb7" },
	{ url = "*/",       fg = "#ffb4a9" },
	{ url = "*",        fg = "#f1dedc" },
]
# yazi theme.toml - generated by matugen

[mgr]
cwd = { fg = "#ffb693" }
hovered = { fg = "#542104", bg = "#ffb693" }

marker_selected = { fg = "#e6beac", bg = "#e6beac" }
marker_copied   = { fg = "#d1c88f", bg = "#d1c88f" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }

tab_active   = { fg = "#542104", bg = "#ffb693" }
tab_inactive = { fg = "#f0dfd8", bg = "#271e1a" }

border_style = { fg = "#a08d85" }

[mode]
normal_main = { fg = "#542104", bg = "#ffb693", bold = true }
select_main = { fg = "#432a1e", bg = "#e6beac", bold = true }
unset_main  = { fg = "#690005", bg = "#ffb4ab", bold = true }

[status]
progress_normal = { fg = "#ffb693", bg = "#322824" }

[input]
border = { fg = "#ffb693" }

[select]
border = { fg = "#ffb693" }
active = { fg = "#d1c88f" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d1c88f" },
	{ mime = "video/*", fg = "#e6beac" },
	{ url = "*/",       fg = "#ffb693" },
	{ url = "*",        fg = "#f0dfd8" },
]
font_family             JetBrains Mono Nerd Font
italic_font             Jetbrains Mono Nerd Font Italic
bold_font               JetBrainsMono Nerd Font Bold
bold_italic_font        JetBrainsMono Nerd Font Bold Italic

font_size               12 
bold_font               auto 
italic_font             auto 

background_opacity      0.1

window_padding_width    10

tab_bar_edge            bottom  
tab_bar_style           powerline

tab_bar_style           powerline

map ctrl+shift+t        new_tab
map ctrl+shift+w        close_tab
map ctrl+shift+enter    new_window

confirm_os_window_close 0 

cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.05
cursor_shape block
cursor_blink true

allow_remote_control yes
listen_on unix:/tmp/mykitty

cursor_text_color     #080808

shell_integration enabled

# ──────────────────────────────
#   COLORS — Koda Palette Dark Monochrome
# ──────────────────────────────

foreground            #a6a6a6
background            #080808
background_opacity    0.98

selection_foreground  #c4c4c4
selection_background  #1a1a1a

cursor                #c4c4c4
cursor_text_color     #080808

url_color             #8a8a8a
active_border_color   #1a1a1a
inactive_border_color #121212

# ───────── ANSI

# black / base
color0   #000000
color8   #3d3d3d

# red / danger
color1   #4a4a4a
color9   #686868

# green
color2   #5c5c5c
color10  #a6a6a6

# yellow / warning
color3   #666666
color11  #b0b0b0

# blue / highlight
color4   #707070
color12  #b8b8b8

# magenta / pink
color5   #7a7a7a
color13  #d0d0d0

# cyan
color6   #848484
color14  #c0c0c0

# white / fg
color7   #a6a6a6
color15  #e0e0e0
